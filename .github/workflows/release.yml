# Release automation: rc tags and sync PRs on version lines, a test-stage deploy of each rc,
# final tags on release day, manual cuts and deploys. Logic lives in .github/scripts/release.mjs;
# rules in RELEASING.md.
#
# Token: secrets.RELEASE_TOKEN if set (a GitHub App token or an admin's fine-grained PAT), else
# GITHUB_TOKEN. With GITHUB_TOKEN, sync PRs, tags and branches it creates do not trigger other
# workflows, so required checks never run on sync PRs. See RELEASING.md, "Setup".
# Deploys (optional): vars.CUBESHIP_URL, vars.DEPLOY_TEST_APPS, vars.DEPLOY_PROD_APPS and
# secrets.CUBESHIP_TOKEN. Without DEPLOY_*_APPS nothing is deployed. A deploy fails unless each app's
# container stays up afterwards; vars.RELEASE_HEALTH_STABLE_S / RELEASE_HEALTH_WAIT_S tune that.
name: Release

on:
  push:
    branches: ['release/v*', 'hotfix/v*']
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      command:
        description: What to do
        type: choice
        options: [cut-release, cut-hotfix, deploy]
        required: true
      version:
        description: 'cut-release only: force X.Y (e.g. 1.0). Empty = next minor.'
        type: string
        required: false
        default: ''
      stage:
        description: 'deploy only: where to'
        type: choice
        options: [test, prod]
        default: test
      tag:
        description: 'deploy only: the tag. Empty = last rc of the newest open release.'
        type: string
        required: false
        default: ''
      dry_run:
        description: Only print what would happen
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
  CUBESHIP_URL: ${{ vars.CUBESHIP_URL }}
  CUBESHIP_TOKEN: ${{ secrets.CUBESHIP_TOKEN }}
  DEPLOY_TEST_APPS: ${{ vars.DEPLOY_TEST_APPS }}
  DEPLOY_PROD_APPS: ${{ vars.DEPLOY_PROD_APPS }}
  RELEASE_HEALTH_STABLE_S: ${{ vars.RELEASE_HEALTH_STABLE_S }}
  RELEASE_HEALTH_WAIT_S: ${{ vars.RELEASE_HEALTH_WAIT_S }}

jobs:
  rc:
    if: github.event_name == 'push' && !github.event.deleted
    runs-on: ubuntu-latest
    outputs:
      # This line's rc on the pushed commit; empty when the commit already carried another release
      # tag (a cut: no new code), so deploy-test is skipped.
      tag: ${{ steps.rc.outputs.tag }}
    concurrency:
      group: release-line-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Tag release candidate
        id: rc
        run: node .github/scripts/release.mjs rc --branch "$GITHUB_REF_NAME" --sha "$GITHUB_SHA"
      - name: Open sync PR
        run: node .github/scripts/release.mjs sync --branch "$GITHUB_REF_NAME" --sha "$GITHUB_SHA"

  deploy-test:
    needs: rc
    if: vars.DEPLOY_TEST_APPS != '' && needs.rc.outputs.tag != ''
    runs-on: ubuntu-latest
    concurrency:
      group: release-deploy-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Deploy the line's last rc to the test stage
        run: node .github/scripts/release.mjs deploy --stage test --branch "$GITHUB_REF_NAME"

  final:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      (startsWith(github.event.pull_request.head.ref, 'release/v') ||
       startsWith(github.event.pull_request.head.ref, 'hotfix/v'))
    runs-on: ubuntu-latest
    concurrency:
      group: release-final
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Tag final release
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: node .github/scripts/release.mjs final --head "$HEAD_REF" --sha "$MERGE_SHA"

  cleanup:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.base.ref, 'release/v') ||
       startsWith(github.event.pull_request.base.ref, 'hotfix/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Delete the merged branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node .github/scripts/release.mjs cleanup --head "$HEAD_REF" --base "$BASE_REF"

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.command == 'deploy'
    runs-on: ubuntu-latest
    concurrency:
      group: release-deploy-${{ inputs.stage }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Deploy
        env:
          STAGE: ${{ inputs.stage }}
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(deploy --stage "$STAGE")
          if [ -n "$TAG" ]; then args+=("$TAG"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node .github/scripts/release.mjs "${args[@]}"

  cut:
    if: github.event_name == 'workflow_dispatch' && inputs.command != 'deploy'
    runs-on: ubuntu-latest
    concurrency:
      group: release-cut
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Cut version line
        env:
          COMMAND: ${{ inputs.command }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=("$COMMAND")
          if [ -n "$VERSION" ]; then args+=(--version "$VERSION"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node .github/scripts/release.mjs "${args[@]}"
