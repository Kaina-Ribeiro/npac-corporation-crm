# Release automation: rc tags and sync PRs on version lines, a test-stage deploy of each rc,
# final tags on release day, manual cuts and deploys. The jobs and the logic live in the release
# kit (Kaina-Ribeiro/release-kit), pinned at @v1: a kit fix reaches this repository without a PR.
# Rules in RELEASING.md. Keep the triggers and inputs; edit only what is passed below.
#
# Token: secrets.RELEASE_TOKEN if set (a GitHub App token or an admin's fine-grained PAT), else
# GITHUB_TOKEN. With GITHUB_TOKEN, sync PRs, tags and branches it creates do not trigger other
# workflows, so required checks never run on sync PRs. See RELEASING.md, "Setup".
# Deploys (optional): vars.CUBESHIP_URL, vars.DEPLOY_TEST_APPS, vars.DEPLOY_PROD_APPS and
# secrets.CUBESHIP_TOKEN. Without DEPLOY_*_APPS nothing is deployed. A deploy fails unless each app's
# container stays up afterwards; vars.RELEASE_HEALTH_STABLE_S / RELEASE_HEALTH_WAIT_S tune that.
name: Release

on:
  push:
    branches: ['release/v*', 'hotfix/v*']
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      command:
        description: What to do
        type: choice
        options: [cut-release, cut-hotfix, deploy]
        required: true
      version:
        description: 'cut-release only: force X.Y (e.g. 1.0). Empty = next minor.'
        type: string
        required: false
        default: ''
      stage:
        description: 'deploy only: where to'
        type: choice
        options: [test, prod]
        default: test
      tag:
        description: 'deploy only: the tag. Empty = last rc of the branch you run from (or the tag you run from).'
        type: string
        required: false
        default: ''
      dry_run:
        description: Only print what would happen
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    uses: Kaina-Ribeiro/release-kit/.github/workflows/release.yml@v1
    with:
      command: ${{ inputs.command || '' }}
      version: ${{ inputs.version || '' }}
      stage: ${{ inputs.stage || 'test' }}
      tag: ${{ inputs.tag || '' }}
      dry_run: ${{ inputs.dry_run == true }}
      cubeship_url: ${{ vars.CUBESHIP_URL }}
      deploy_test_apps: ${{ vars.DEPLOY_TEST_APPS }}
      deploy_prod_apps: ${{ vars.DEPLOY_PROD_APPS }}
      health_stable_s: ${{ vars.RELEASE_HEALTH_STABLE_S }}
      health_wait_s: ${{ vars.RELEASE_HEALTH_WAIT_S }}
    secrets:
      release_token: ${{ secrets.RELEASE_TOKEN }}
      cubeship_token: ${{ secrets.CUBESHIP_TOKEN }}
