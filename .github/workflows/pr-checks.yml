# PR checks required by the rulesets: `pr-checks / checks` (install, lint, typecheck) and
# `pr-checks / conventions` (branch name, PR title, which branches may merge into the default
# branch). The jobs live in the release kit (Kaina-Ribeiro/release-kit), pinned at @v1. Keep the
# job id `pr-checks`: the rulesets require these exact names. Rules in RELEASING.md.
#
# Optional repository variables:
#   CHECKS_COMMAND  your own check (e.g. "make lint"), run from the project's root; when set, it
#                   replaces the Node install/lint/typecheck below
#   CHECKS_DIRS    space-separated folders with a package.json (default: the root one, else
#                   every package.json up to two folders deep)
#   CHECKS_SCRIPTS  package.json scripts to run (default: "lint typecheck type-check"; missing
#                   ones are skipped)
#   TICKET_PATTERN  regex for ticket ids (default: [A-Z][A-Z0-9]+-\d+, e.g. ABC-12)
name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-checks:
    uses: Kaina-Ribeiro/release-kit/.github/workflows/pr-checks.yml@v1
    with:
      checks_command: ${{ vars.CHECKS_COMMAND }}
      checks_dirs: ${{ vars.CHECKS_DIRS }}
      checks_scripts: ${{ vars.CHECKS_SCRIPTS }}
      ticket_pattern: ${{ vars.TICKET_PATTERN }}
