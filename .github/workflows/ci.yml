name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: npac_owner
          POSTGRES_PASSWORD: ci_owner_password
          POSTGRES_DB: npac
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U npac_owner -d npac"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://npac_owner:ci_owner_password@localhost:5432/npac
      TEST_DATABASE_URL: postgresql://npac_owner:ci_owner_password@localhost:5432/npac_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test
      - run: pnpm audit --audit-level high
