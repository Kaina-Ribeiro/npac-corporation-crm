name: CI
on:
  push:
    branches: [main]
  pull_request:
    # PR só de documentação não roda testes (lint, typecheck e convenções seguem no PR checks).
    paths-ignore: ['docs/**', '**/*.md']

# Commit novo no mesmo PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Valores descartáveis só para CI (base64 de 32 bytes).
env:
  APP_DB_PASSWORD: ci_app_password
  BETTER_AUTH_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  FIELD_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  MENTORADO_ENCRYPTION_KEY: bWVudG9yaWEtY2hhdmUtZGUtdGVzdGUtMzItYnl0ZXM=
  MEDIA_DIR: /tmp/npac-media
  BLIND_INDEX_KEY: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=
  API_PORT: 4000
  WEB_ORIGIN: http://localhost:3000

# Tudo em paralelo: o tempo total é o do job mais lento, não a soma. Os testes da API e o e2e são
# divididos em partes (matrix.shard), cada parte com o próprio Postgres, API e web: nada é
# compartilhado entre elas. A suíte cresceu e uma parte passou de ~3 min? Some um número à lista
# `shard` do job; nada mais muda. O job `ci` no fim resume tudo em um nome só.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm turbo run lint typecheck
      - run: pnpm turbo run test --filter=@npac/shared
      - run: pnpm audit --audit-level high

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: npac_owner
          POSTGRES_PASSWORD: ci_owner_password
          POSTGRES_DB: npac
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U npac_owner -d npac"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://npac_owner:ci_owner_password@localhost:5432/npac
      APP_DATABASE_URL: postgresql://npac_app:ci_app_password@localhost:5432/npac
      TEST_DATABASE_URL: postgresql://npac_owner:ci_owner_password@localhost:5432/npac_test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build dos pacotes (db, shared)
        run: pnpm turbo run build --filter="./packages/*"
      - name: Criar role npac_app e banco npac_test
        run: node packages/db/dist/app-role-cli.js
      - run: pnpm --filter @npac/db test

  api:
    name: api (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Uma parte que falha não cancela as outras: dá para ver tudo e rodar de novo só a que falhou.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: npac_owner
          POSTGRES_PASSWORD: ci_owner_password
          POSTGRES_DB: npac
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U npac_owner -d npac"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://npac_owner:ci_owner_password@localhost:5432/npac
      APP_DATABASE_URL: postgresql://npac_app:ci_app_password@localhost:5432/npac
      TEST_DATABASE_URL: postgresql://npac_owner:ci_owner_password@localhost:5432/npac_test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build dos pacotes (db, shared)
        run: pnpm turbo run build --filter="./packages/*"
      - name: Criar role npac_app e banco npac_test
        run: node packages/db/dist/app-role-cli.js
      - run: pnpm --filter @npac/api exec vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  e2e:
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    # Imagem oficial com Chromium e WebKit já instalados (sem o apt das libs do WebKit, que travava).
    # Manter a tag igual à versão do @playwright/test no pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: npac_owner
          POSTGRES_PASSWORD: ci_owner_password
          POSTGRES_DB: npac
        options: >-
          --health-cmd "pg_isready -U npac_owner -d npac"
          --health-interval 5s --health-timeout 5s --health-retries 10
    # Dentro do container o Postgres atende pelo nome do serviço, não por localhost.
    env:
      DATABASE_URL: postgresql://npac_owner:ci_owner_password@postgres:5432/npac
      APP_DATABASE_URL: postgresql://npac_app:ci_app_password@postgres:5432/npac
      TEST_DATABASE_URL: postgresql://npac_owner:ci_owner_password@postgres:5432/npac_test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Tudo compilado aqui pelo turbo: pacotes, depois API e web ao mesmo tempo (dentro do Playwright
      # era um depois do outro). E2E_PREBUILT avisa o playwright.config de que é só subir os servidores.
      # API_INTERNAL_URL fica gravada no build do web: a porta é a da API do e2e (apps/web/e2e/env.ts).
      # Sem checagem de tipos no build: o job `static` já roda o typecheck.
      - name: Build (pacotes, depois API e web em paralelo)
        run: pnpm turbo run build
        env:
          API_INTERNAL_URL: http://localhost:4100
          NEXT_SKIP_TYPECHECK: '1'
      # Sem psql no container: o mesmo SQL do 01-app-role.sh, por Node. Instalar psql por apt
      # dependia dos espelhos do Ubuntu, que às vezes não resolviam e derrubavam o CI (exit 100).
      - name: Criar role npac_app e banco npac_test
        run: node packages/db/dist/app-role-cli.js
      - run: pnpm --filter @npac/web e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          E2E_PREBUILT: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures-${{ matrix.shard }}
          path: apps/web/test-results

  # Um nome só para olhar (e para exigir no ruleset, se um dia quiser): verde só com tudo verde.
  ci:
    if: always()
    needs: [static, db, api, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Resultado de todos os jobs
        run: |
          echo "static=${{ needs.static.result }} db=${{ needs.db.result }} api=${{ needs.api.result }} e2e=${{ needs.e2e.result }}"
          test "${{ needs.static.result }}${{ needs.db.result }}${{ needs.api.result }}${{ needs.e2e.result }}" = "successsuccesssuccesssuccess"
