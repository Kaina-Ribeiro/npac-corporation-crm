name: CI
on:
  push:
    branches: [main]
  pull_request:

# Valores descartáveis só para CI (base64 de 32 bytes).
env:
  APP_DB_PASSWORD: ci_app_password
  BETTER_AUTH_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  FIELD_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  MENTORADO_ENCRYPTION_KEY: bWVudG9yaWEtY2hhdmUtZGUtdGVzdGUtMzItYnl0ZXM=
  MEDIA_DIR: /tmp/npac-media
  BLIND_INDEX_KEY: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=
  API_PORT: 4000
  WEB_ORIGIN: http://localhost:3000

# Dois jobs em paralelo: o tempo total é o do e2e, não a soma.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: npac_owner
          POSTGRES_PASSWORD: ci_owner_password
          POSTGRES_DB: npac
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U npac_owner -d npac"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://npac_owner:ci_owner_password@localhost:5432/npac
      APP_DATABASE_URL: postgresql://npac_app:ci_app_password@localhost:5432/npac
      TEST_DATABASE_URL: postgresql://npac_owner:ci_owner_password@localhost:5432/npac_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Criar role npac_app e banco npac_test
        run: sh infra/postgres/init/01-app-role.sh
        env:
          PGHOST: localhost
          PGPASSWORD: ci_owner_password
          POSTGRES_USER: npac_owner
          POSTGRES_DB: npac
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test
      - run: pnpm audit --audit-level high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Imagem oficial com Chromium e WebKit já instalados (sem o apt das libs do WebKit, que travava).
    # Manter a tag igual à versão do @playwright/test no pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: npac_owner
          POSTGRES_PASSWORD: ci_owner_password
          POSTGRES_DB: npac
        options: >-
          --health-cmd "pg_isready -U npac_owner -d npac"
          --health-interval 5s --health-timeout 5s --health-retries 10
    # Dentro do container o Postgres atende pelo nome do serviço, não por localhost.
    env:
      DATABASE_URL: postgresql://npac_owner:ci_owner_password@postgres:5432/npac
      APP_DATABASE_URL: postgresql://npac_app:ci_app_password@postgres:5432/npac
      TEST_DATABASE_URL: postgresql://npac_owner:ci_owner_password@postgres:5432/npac_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Instalar psql
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client
      - name: Criar role npac_app e banco npac_test
        run: sh infra/postgres/init/01-app-role.sh
        env:
          PGHOST: postgres
          PGPASSWORD: ci_owner_password
          POSTGRES_USER: npac_owner
          POSTGRES_DB: npac
      - run: pnpm install --frozen-lockfile
      - name: Build dos pacotes (db, shared) usados pelo e2e
        run: pnpm turbo run build --filter="./packages/*"
      - run: pnpm --filter @npac/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: apps/web/test-results
