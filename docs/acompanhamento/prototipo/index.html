<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Acompanhamento v2: protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* Tokens copiados de apps/web/app/globals.css. Dados todos inventados. */
:root{--bg:#e1e0e4;--ink:#232326;--ink2:#6e6e73;--ink3:#8e8e93;--line:rgba(60,60,67,.14);--gl:rgba(255,255,255,.4);--gl2:rgba(255,255,255,.46);--gl-solid:#f1f0f3;
--glhi:inset 0 1.5px 0 rgba(255,255,255,.8),inset 0 -1px 2px rgba(255,255,255,.45),inset 0 0 0 .5px rgba(255,255,255,.75);--gld:0 0 0 .5px rgba(0,0,0,.04),0 14px 34px -14px rgba(0,0,0,.18);--blur:blur(30px) saturate(2.1);
--gold:#e2bb66;--gold-deep:#a87818;--gold-ring:rgba(194,146,46,.75);--danger:#d7264a;--ok:oklch(69.6% .17 162.48);--linha-ouro:var(--gold-deep);--on:rgba(255,255,255,.8);--fill:rgba(255,255,255,.58);--fill-line:rgba(60,60,67,.2);--amber:#a87818;
--wash:radial-gradient(80% 38% at 100% 0%,rgba(226,187,102,.38),transparent 70%),radial-gradient(70% 40% at 0% 100%,rgba(110,145,255,.22),transparent 70%),radial-gradient(50% 30% at 25% 48%,rgba(255,140,165,.1),transparent 70%);
--font:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display',Geist,system-ui,sans-serif}
.dark{--bg:#0b0b0d;--ink:#f5f5f7;--ink2:#a1a1a6;--line:rgba(235,235,245,.14);--gl:rgba(28,28,32,.6);--gl2:rgba(36,36,40,.66);--gl-solid:#1c1c20;--glhi:inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 .5px rgba(255,255,255,.08);--gld:0 14px 34px -14px rgba(0,0,0,.6);--on:rgba(255,255,255,.12);--linha-ouro:var(--gold);--fill:rgba(255,255,255,.06);--fill-line:rgba(235,235,245,.14);--amber:#e2bb66;
--wash:radial-gradient(80% 38% at 100% 0%,rgba(226,187,102,.18),transparent 70%),radial-gradient(70% 40% at 0% 100%,rgba(110,145,255,.12),transparent 70%)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--wash),var(--bg);background-attachment:fixed;color:var(--ink);min-height:100%}
body{font-family:var(--font);letter-spacing:-.012em;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;font-size:14px;line-height:20px}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;letter-spacing:inherit}h1,h2,h3,p,ul{margin:0;padding:0}ul{list-style:none}
:focus-visible{outline:2px solid #c2922e;outline-offset:2px}
.glass{background:var(--gl);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--glhi),var(--gld)}
.card{position:relative;border-radius:20px;background:var(--gl2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--glhi),var(--gld)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:12px;padding:9px 16px;font-size:14px;font-weight:600;line-height:20px;cursor:pointer;white-space:nowrap;background:transparent}
.btn svg{width:16px;height:16px;flex:none}
.btn.p{background:var(--ink);color:var(--bg)}.btn.s{background:var(--fill);border-color:var(--line)}.btn.d{border-color:color-mix(in srgb,var(--danger) 40%,transparent);color:var(--danger)}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:10px}
.btn.s:hover,.btn:not(.p):not(.d):hover{background:rgba(0,0,0,.05)}.btn.wa{color:#11704f}.dark .btn.wa{color:#8fdcbc}
.field{height:42px;border-radius:12px;border:0;padding:0 12px;font:inherit;font-size:14px;color:var(--ink);width:100%;background:var(--fill);box-shadow:inset 0 0 0 .5px var(--fill-line),inset 0 1px 2px rgba(0,0,0,.05)}
select.field{appearance:none;padding-right:28px;text-overflow:ellipsis;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px;background-repeat:no-repeat}
textarea.field{height:auto;min-height:66px;padding:10px 12px;line-height:1.4;resize:vertical}
.field:focus{outline:none;box-shadow:inset 0 0 0 1px var(--gold-ring),0 0 0 4px rgba(194,146,46,.18)}
.field[readonly]{color:var(--ink2);background:transparent;box-shadow:inset 0 0 0 .5px var(--line)}

.app{display:flex;min-height:100dvh}
.side{position:sticky;top:10px;margin:10px 0 10px 10px;height:calc(100dvh - 20px);width:236px;flex:none;display:none;flex-direction:column;gap:14px;border-radius:24px;padding:12px 10px;overflow:hidden;z-index:30}
.brand{display:flex;align-items:center;gap:8px;padding:4px 4px 0 8px;font-size:15px;font-weight:600}
.mark{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9px;background:linear-gradient(160deg,#1c1b19,#050506);color:var(--gold);font-family:Anton,Impact,sans-serif;font-size:17px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 0 24px -8px rgba(226,187,102,.55)}
.side nav{display:flex;flex-direction:column;gap:1px;overflow-y:auto;min-height:0}
.nl{display:flex;height:34px;align-items:center;gap:10px;border-radius:8px;padding:0 10px;font-size:14px;font-weight:500;color:var(--ink2);flex:none}
.nl svg{width:16px;height:16px;flex:none}.nl:hover{background:rgba(0,0,0,.05);color:var(--ink)}
.nl.on{background:var(--on);color:var(--ink);box-shadow:inset 0 1px 0 #fff,0 2px 10px rgba(0,0,0,.08)}.dark .nl.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.nl small{margin-left:auto;font-size:11px;font-weight:500;color:var(--ink3)}.nl .cnt{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.nsec{padding:12px 10px 4px;font-size:12px;font-weight:600;color:var(--ink3)}
.foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 4px 0;display:flex;gap:10px;align-items:center}
.foot b{display:block;font-size:13px;font-weight:600;line-height:16px}.foot div span{font-size:12px;line-height:16px;color:var(--ink2)}
main{flex:1;min-width:0;padding:16px 16px 112px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:10px}
.search{position:relative;flex:1;max-width:520px}.search svg{position:absolute;left:12px;top:13px;width:16px;height:16px;color:var(--ink3)}.search input{padding-left:36px}
.saved{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--ink2);white-space:nowrap}.saved i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.ava{flex:none;width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.28);position:relative}
.ava.me{width:36px;height:36px;font-size:13px;background:linear-gradient(160deg,#7fe0a6,#1e9e70)}
.pair{flex:none;display:inline-flex;width:66px}.pair .ava:last-child{margin-left:-14px;box-shadow:0 0 0 2px var(--gl-solid)}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:7px;font-size:12px;font-weight:600;white-space:nowrap;background:rgba(120,120,128,.14);color:var(--ink2)}
.tag.ativo{background:#dcf3ea;color:#11704f}.tag.onb{background:#e3efff;color:#0a5ab8}.tag.pausa{background:#f6ecd4;color:#7a560f}.tag.canc{background:#fbe4ec;color:#a8285a}.tag.gold{background:#f6ecd4;color:#7a560f}
.dark .tag.ativo{background:rgba(46,170,120,.2);color:#8fdcbc}.dark .tag.onb{background:rgba(63,140,242,.2);color:#9cc5ff}.dark .tag.pausa,.dark .tag.gold{background:rgba(226,187,102,.16);color:#f2d38a}.dark .tag.canc{background:rgba(219,95,140,.2);color:#f5a6c3}

/* A trilha: 12 meses, a assinatura visual do módulo. */
.trail{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;width:100%}.trail i{height:6px;border-radius:3px;background:rgba(120,120,128,.2)}
.trail i.f{background:var(--linha-ouro)}.trail i.c{background:linear-gradient(90deg,var(--linha-ouro) 45%,rgba(120,120,128,.2) 45%)}.trail i.l{background:var(--danger)}
.h1{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.03em}.sub{color:var(--ink2);font-size:14px;margin-top:2px}
.hrow{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}.acts{display:flex;flex-wrap:wrap;gap:8px}

/* Fila */
.grp{overflow:hidden}.grp>header{display:flex;align-items:center;gap:8px;padding:14px 16px 10px}.grp h2{font-size:15px;font-weight:600;letter-spacing:-.015em}.grp>header span{color:var(--ink3);font-size:13px}
.it{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 16px;border-top:1px solid var(--line);position:relative}
.it.late::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--danger)}
.it .who{font-size:14px;font-weight:600}.it .what{font-size:14px;color:var(--ink2)}.it .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.it .do{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.it:has(.do>.check:only-child){grid-template-columns:auto 1fr auto;align-items:center}.it:has(.do>.check:only-child) .do{grid-column:auto;margin-top:0}
.due{font-size:12px;font-weight:600;color:var(--ink2)}.due.late{color:var(--danger)}
.check{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink3);background:transparent;cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center;color:transparent}.check:hover{border-color:var(--ok);color:var(--ok)}.check svg{width:16px;height:16px}
.grid2{display:grid;gap:14px}

/* Mentorados */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filters .chip{grid-column:1/-1}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 14px;border-radius:12px;font-size:14px;font-weight:600;background:#f6ecd4;color:#7a560f;border:0;cursor:pointer;white-space:nowrap}.dark .chip{background:rgba(226,187,102,.16);color:#f2d38a}
.lhead{display:none}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;padding:14px 16px;border-top:1px solid var(--line);align-items:center;cursor:pointer}.row:first-child{border-top:0}.row:hover{background:rgba(255,255,255,.28)}.dark .row:hover{background:rgba(255,255,255,.04)}
.row .nm{font-size:15px;font-weight:600;min-width:0}.row .nm small{display:block;font-size:13px;font-weight:400;color:var(--ink2)}
.row .jm{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:10px}.row .jm b{font-size:12px;font-weight:600;white-space:nowrap;min-width:48px}
.row .rs,.row .lc{display:none}
.row .mobmeta{grid-column:1/-1;font-size:13px;color:var(--ink2);margin-top:6px}

/* Ficha */
.back{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:500;color:var(--ink2)}.back svg{width:14px;height:14px}
.fh{padding:18px 16px}.fh-top{display:flex;gap:14px;align-items:center}.fh .ava{width:64px;height:64px;font-size:22px}.fh .pair{width:106px}.fh .pair .ava:last-child{margin-left:-22px}
.fh h1{font-size:24px;line-height:29px;font-weight:700;letter-spacing:-.03em}.fh-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fh-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.months{margin-top:18px}.months .lbl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:13px;color:var(--ink2)}.months .lbl b{font-size:15px;color:var(--ink);font-weight:600}
.rail{display:grid;grid-template-columns:repeat(12,1fr);position:relative}
.rail .m{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:11px;color:var(--ink3)}
.rail .m::before{content:'';position:absolute;top:8px;left:-50%;width:100%;height:2px;background:rgba(120,120,128,.25)}.rail .m:first-child::before{display:none}.rail .m.f::before,.rail .m.c::before{background:var(--linha-ouro)}
.rail .dot{position:relative;width:18px;height:18px;border-radius:50%;background:var(--gl-solid);box-shadow:inset 0 0 0 1.5px rgba(120,120,128,.4);display:flex;align-items:center;justify-content:center;color:#fff}
.rail .f .dot{background:var(--linha-ouro);box-shadow:none}.rail .c .dot{background:var(--gl-solid);box-shadow:inset 0 0 0 2.5px var(--linha-ouro),0 0 0 4px rgba(194,146,46,.2)}.rail .l .dot{background:var(--danger);box-shadow:none}
.rail .dot svg{width:10px;height:10px}.rail .fo{display:none;text-align:center;line-height:14px;padding:0 3px}.rail .c{color:var(--ink);font-weight:600}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px;position:sticky;top:0;z-index:10}.tabs a{flex:none;height:36px;display:inline-flex;align-items:center;padding:0 14px;border-radius:18px;font-size:13px;font-weight:600;color:var(--ink2)}.tabs a.on{background:var(--on);color:var(--ink);box-shadow:inset 0 1px 0 #fff,0 2px 10px rgba(0,0,0,.08)}
.cols{display:grid;gap:14px}.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec{padding:16px}.sec>header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}.sec h2{font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.02em}.sec h3{font-size:14px;font-weight:600;margin:16px 0 8px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f{display:flex;flex-direction:column;gap:4px;min-width:0}.f.w{grid-column:1/-1}.people.two .f.wm{grid-column:1/-1}@media (max-width:767.98px){.f.wm{grid-column:1/-1}}.f label{font-size:12px;font-weight:500;color:var(--ink2)}.f .hint{font-size:11px;color:var(--ink3);line-height:14px}
.people{display:grid;gap:14px}.pc{min-width:0}.pc+.pc{border-top:1px solid var(--line);padding-top:14px}.pc-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}.pc-h b{font-size:15px;font-weight:600}.pc-h div span{display:block;font-size:12px;color:var(--ink2);line-height:16px}.pc-h .btn{margin-left:auto}
.locked{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:#7a560f}.dark .locked{color:#f2d38a}.locked svg{width:13px;height:13px}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.pl{display:flex;flex-direction:column;gap:2px;padding:10px;border-radius:12px;background:var(--fill);box-shadow:inset 0 0 0 .5px var(--line)}.pl small{font-size:12px;color:var(--ink2)}.pl b{font-size:20px;line-height:24px;font-weight:700;letter-spacing:-.02em}
.steps{display:flex;flex-direction:column}.st{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:flex-start;padding:8px 0;position:relative}.st .n{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--linha-ouro);color:#fff;position:relative;z-index:1}.st .n svg{width:11px;height:11px}.st.p .n{background:var(--gl-solid);color:var(--ink2);box-shadow:inset 0 0 0 1.5px rgba(120,120,128,.4)}.st.a .n{background:var(--gl-solid);color:var(--linha-ouro);box-shadow:inset 0 0 0 2px var(--linha-ouro)}
.st:not(:last-child)::after{content:'';position:absolute;left:9px;top:28px;bottom:-8px;width:2px;background:rgba(120,120,128,.25)}.st b{font-size:14px;font-weight:600;display:block}.st span{font-size:12px;color:var(--ink2);display:block;line-height:16px}.st em{font-style:normal;font-size:12px;font-weight:600;color:var(--ink2)}.st em.late{color:var(--danger)}
.acao{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.acao b{font-size:14px;font-weight:600}.acao span{font-size:12px;color:var(--ink2);display:block;line-height:16px}.check.sm{width:22px;height:22px}.check.sm svg{width:12px;height:12px}.check.done{background:var(--ok);border-color:var(--ok);color:#fff}
.hf{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:6px}.hf button{flex:none;border:0;background:transparent;height:30px;border-radius:15px;padding:0 11px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer}.hf .on{background:var(--ink);color:var(--bg)}
.ev{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.ev .i{width:28px;height:28px;border-radius:50%;background:rgba(120,120,128,.14);display:flex;align-items:center;justify-content:center;color:var(--ink2)}.ev .i svg{width:14px;height:14px}.ev b{font-size:13px;font-weight:600;display:block}.ev p{font-size:13px;color:var(--ink2)}.ev time{font-size:12px;color:var(--ink3)}

.bnav{position:fixed;right:14px;left:14px;bottom:max(16px,env(safe-area-inset-bottom));z-index:40;height:68px;border-radius:34px;display:grid;grid-template-columns:repeat(5,1fr);padding:6px}
.bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:28px;font-size:10px;font-weight:500;color:var(--ink2)}.bnav a.on{background:var(--on);font-weight:600;color:var(--ink);box-shadow:inset 0 1px 0 #fff,0 2px 10px rgba(0,0,0,.08)}.bnav svg{width:22px;height:22px}
.bnav .plus{margin:auto;width:56px;height:56px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px -8px rgba(0,0,0,.5);cursor:pointer}
.view{display:none}.view.on{display:flex;flex-direction:column;gap:18px}
.mob{display:flex;align-items:center;justify-content:space-between}.mob>span:first-child{font-size:13px;font-weight:600;color:var(--ink2)}

@media (min-width:768px){
 .side{display:flex}.bnav,.mob{display:none}main{padding:22px 24px 40px}
 .filters{display:flex;flex-wrap:wrap}.filters .field{width:180px}.filters .chip{margin-left:auto}
 .form{grid-template-columns:repeat(3,1fr)}.fh{padding:22px}.sec{padding:20px}.rail .fo{display:block}.tabs{margin:0;padding:0}
 .it .do{grid-column:2/-1}
}
@media (min-width:1024px){
 .lhead,.row{grid-template-columns:minmax(220px,1.6fr) 96px minmax(150px,1fr) 104px 92px 104px;gap:12px;align-items:center}
 .lhead{display:grid;padding:12px 16px;font-size:12px;font-weight:600;color:var(--ink2);border-bottom:1px solid var(--line)}
 .row{display:grid;padding:12px 16px}.row .cell-n{display:flex;align-items:center;gap:12px;min-width:0}.row .jm{grid-column:auto;margin-top:0}.row .rs,.row .lc{display:block;font-size:13px;color:var(--ink2)}.row .mobmeta{display:none}
 .cols{grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);align-items:start}.people.two{grid-template-columns:1fr 1fr;gap:24px}.people.two .pc+.pc{border-top:0;padding-top:0}.people.two .form{grid-template-columns:1fr 1fr}
}
@media (max-width:1023.98px){.row .cell-n{display:contents}.row .tp{justify-self:end}.row .st-tag{grid-column:3;grid-row:1}.row .tp{display:none}}
@media (min-width:1280px){.grid2{grid-template-columns:1fr 1fr;align-items:start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side glass">
    <div class="brand"><span class="mark">N</span><b>NPAC Corporation</b></div>
    <nav aria-label="Navegação lateral" id="menu"></nav>
    <div class="foot"><span class="ava me">D</span><div><b>Duda</b><span>Acompanhamento e Admin</span></div></div>
  </aside>
  <main><div class="wrap">
    <div class="mob"><span>Acompanhamento</span><span class="ava me">D</span></div>
    <div class="top">
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input class="field" type="search" aria-label="Buscar mentorados" placeholder="Nome, telefone com DDD ou e-mail" /></div>
    </div>
    <section class="view" id="v-fila"></section>
    <section class="view" id="v-mentorados"></section>
    <section class="view" id="v-ficha"></section>
    <section class="view" id="v-casal"></section>
  </div></main>
  <nav class="bnav glass" aria-label="Abas do acompanhamento" id="bnav"></nav>
