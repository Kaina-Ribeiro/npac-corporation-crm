<!doctype html>
<!--
  Protótipo estático da opção A refinada (A1: cara de iOS 26), 24/11/2026. Só para fotografar.
  Parâmetros: ?v=A1|A2|A3 &tela=lista|conversa|teclado|mencao|nova|mesa &tema=claro|escuro &novo=0
  A2 = sem vidro (sólido); A3 = suas bolhas em dourado. "mesa" escolhe o layout pela largura
  (até 900 px: trilho de ícones; acima: sidebar aberta).
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat A1</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Anton&display=swap" rel="stylesheet" />
<style>
/* Tokens de apps/web/app/globals.css + poucos derivados (marcados). */
:root {
  --bg: #e1e0e4; --ink: #232326; --ink2: #5f5f64; --ink3: #6a6a6f;
  --line: rgba(60, 60, 67, 0.14);
  --gl2: rgba(255,255,255,.46); --gl-solid: #f1f0f3;
  --gold: #e2bb66; --gold-deep: #a87818; --gold-text: #7a560f; --danger: #c01f40;
  --on: rgba(255,255,255,.8);
  --glhi: inset 0 1.5px 0 rgba(255,255,255,.8), inset 0 -1px 2px rgba(255,255,255,.45), inset 0 0 0 .5px rgba(255,255,255,.75);
  --gld: 0 0 0 .5px rgba(0,0,0,.04), 0 14px 34px -14px rgba(0,0,0,.18);
  --wash: radial-gradient(80% 38% at 100% 0%, rgba(226,187,102,.38), transparent 70%),
    radial-gradient(70% 40% at 0% 100%, rgba(110,145,255,.22), transparent 70%),
    radial-gradient(50% 30% at 25% 48%, rgba(255,140,165,.1), transparent 70%);
  /* Derivados (protótipo): fundo da conversa, bolhas e vidro das barras. */
  --fundo: #fbfbfd;
  --bolha-outro: #ececef;
  --bolha-eu: linear-gradient(180deg, #3d3d43 0%, #232326 100%); --bolha-eu-fim: #232326; --bolha-eu-txt: #f5f5f7;
  --cartao: rgba(60,60,67,.07); --cartao-eu: rgba(255,255,255,.11);
  --suave: rgba(60,60,67,.07);
  --selecao: rgba(226,187,102,.2);
  --vidro: rgba(246,246,249,.62); --vidro-solido: #ffffff;
  --vidro-sombra: inset 0 1px 0 rgba(255,255,255,.85), inset 0 0 0 .5px rgba(255,255,255,.6), 0 0 0 .5px rgba(0,0,0,.07), 0 10px 28px -12px rgba(0,0,0,.25);
  --kb: #d1d3d9; --tecla: #fff; --tecla2: #abb0ba;
}
.dark {
  --bg: #0b0b0d; --ink: #f5f5f7; --ink2: #a1a1a6; --ink3: #9a9aa0; --danger: #ff5a77; --gold-text: var(--gold);
  --line: rgba(235,235,245,.14); --gl2: rgba(36,36,40,.66); --gl-solid: #1c1c20; --on: rgba(255,255,255,.12);
  --glhi: inset 0 1px 0 rgba(255,255,255,.1), inset 0 0 0 .5px rgba(255,255,255,.08);
  --gld: 0 14px 34px -14px rgba(0,0,0,.6);
  --wash: radial-gradient(80% 38% at 100% 0%, rgba(226,187,102,.18), transparent 70%),
    radial-gradient(70% 40% at 0% 100%, rgba(110,145,255,.12), transparent 70%);
  --fundo: #0b0b0d; --bolha-outro: #26262a;
  --bolha-eu: linear-gradient(180deg, #ffffff 0%, #e4e4e8 100%); --bolha-eu-fim: #e4e4e8; --bolha-eu-txt: #232326;
  --cartao: rgba(255,255,255,.07); --cartao-eu: rgba(0,0,0,.06); --suave: rgba(235,235,245,.09);
  --selecao: rgba(226,187,102,.15);
  --vidro: rgba(44,44,49,.58); --vidro-solido: #2c2c31;
  --vidro-sombra: inset 0 1px 0 rgba(255,255,255,.12), inset 0 0 0 .5px rgba(255,255,255,.07), 0 10px 28px -12px rgba(0,0,0,.7);
  --kb: #2b2b2e; --tecla: #6b6b6e; --tecla2: #464649;
}
/* A3: as suas bolhas em dourado (quebra a regra de cor: precisa de aprovação). */
.A3 { --bolha-eu: linear-gradient(180deg, #ecca7e 0%, #dcb05a 100%); --bolha-eu-fim: #dcb05a; --bolha-eu-txt: #241800; --cartao-eu: rgba(0,0,0,.07); }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--wash), var(--bg); color: var(--ink); overflow: hidden;
  font-family: -apple-system, 'SF Pro Text', Geist, system-ui, sans-serif; letter-spacing: -0.012em;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
svg { width: 20px; height: 20px; flex: none; }
button { font: inherit; color: inherit; border: 0; background: none; }
.trunc { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

.anota .novo { position: relative; outline: 1.5px dashed var(--gold-deep); outline-offset: 3px; border-radius: 10px; }
.anota .novo.abaixo::after { top: auto; bottom: -12px; }
.anota .novo::after { content: 'novo'; position: absolute; top: -11px; right: -6px; z-index: 9;
  font: 600 10px/16px Geist, system-ui, sans-serif; letter-spacing: 0; padding: 0 6px; border-radius: 8px; background: var(--gold); color: #3d2a00; }

/* Vidro líquido só nos controles que flutuam (pequenos). A2 troca por sólido. */
.vidro { background: var(--vidro); -webkit-backdrop-filter: blur(18px) saturate(1.8); backdrop-filter: blur(18px) saturate(1.8); box-shadow: var(--vidro-sombra); }
.A2 .vidro { background: var(--vidro-solido); -webkit-backdrop-filter: none; backdrop-filter: none; }
.glass { background: rgba(255,255,255,.4); -webkit-backdrop-filter: blur(30px) saturate(2.1); backdrop-filter: blur(30px) saturate(2.1); box-shadow: var(--glhi), var(--gld); }
.dark .glass { background: rgba(28,28,32,.6); }

.av { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; flex: none; background: var(--ink); color: var(--bg); font-weight: 700; }
.av.eu { background: linear-gradient(160deg,#7fe0a6,#1e9e70); color: #fff; font-weight: 600; }
.canal { display: inline-flex; align-items: center; justify-content: center; flex: none; background: linear-gradient(160deg,#2a2926,#050506);
  color: var(--gold); font-weight: 700; box-shadow: inset 0 1px 0 rgba(255,255,255,.18), inset 0 0 0 .5px rgba(255,255,255,.08); }
.selo { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--gold); color: #000; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; }
.tag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 7px; }
.role-SDR { background: #e3efff; color: #0a5ab8; } .role-CLOSER { background: #fbe4ec; color: #a8285a; }
.role-HEAD { background: #f6ecd4; color: #7a560f; } .role-DIRETOR { background: #e2bb66; color: #3d2a00; }
.dark .role-SDR { background: rgba(63,140,242,.2); color: #9cc5ff; } .dark .role-CLOSER { background: rgba(219,95,140,.2); color: #f5a6c3; }
.dark .role-HEAD { background: rgba(226,187,102,.16); color: #f2d38a; } .dark .role-DIRETOR { background: #c9a24e; color: #241800; }
.circ { width: 44px; height: 44px; border-radius: 22px; display: inline-flex; align-items: center; justify-content: center; flex: none; }

/* ---------- Conversa ---------- */
.conversa { position: absolute; inset: 0; background: var(--fundo); overflow: hidden; }
.rola { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: var(--pt, 96px) 14px var(--pb, 170px); }
.coluna { width: 100%; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; }
/* Borda de rolagem: o conteúdo some embaixo dos controles (desfoque leve + degradê). */
.borda { position: absolute; left: 0; right: 0; z-index: 4; pointer-events: none; }
.borda.topo { top: 0; height: var(--bt, 118px); background: linear-gradient(var(--fundo) 52%, transparent);
  -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); }
.borda.base { bottom: 0; height: var(--bb, 200px); background: linear-gradient(transparent, var(--fundo) 62%);
  -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); -webkit-mask-image: linear-gradient(transparent, #000 45%); mask-image: linear-gradient(transparent, #000 45%); }
.A2 .borda { -webkit-backdrop-filter: none; backdrop-filter: none; }

/* Topo no estilo do iMessage: voltar à esquerda, foto e nome no meio. */
.cab { position: absolute; top: 8px; left: 10px; right: 10px; z-index: 6; display: flex; justify-content: center; }
.cab .voltar { position: absolute; left: 0; top: 6px; }
.cab .quem { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.cab .nome { height: 24px; padding: 0 10px; border-radius: 12px; display: inline-flex; align-items: center; gap: 2px; font-size: 13px; font-weight: 600; }
.cab .nome svg { width: 12px; height: 12px; opacity: .5; }

.dia { align-self: center; margin: 18px 0 6px; font-size: 12px; color: var(--ink3); }
.dia b { font-weight: 600; }
.antigas { align-self: center; margin: 0 0 4px; height: 36px; padding: 0 14px; border-radius: 18px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink2); }
.antigas svg { width: 16px; height: 16px; }

.grupo { display: flex; gap: 12px; align-items: flex-end; margin-top: 14px; }
.grupo > .av { margin-bottom: 22px; }
.grupo.meu { flex-direction: row-reverse; }
.grupo .col { display: flex; flex-direction: column; gap: 3px; min-width: 0; max-width: 80%; }
.grupo.meu .col { align-items: flex-end; }
.autor { font-size: 12px; color: var(--ink3); margin: 0 0 1px 14px; }
.hora { font-size: 11px; color: var(--ink3); margin: 3px 14px 0; }
.b { position: relative; padding: 8px 14px 9px; border-radius: 20px; background: var(--bolha-outro); font-size: 17px; line-height: 22px; letter-spacing: -0.022em; overflow-wrap: anywhere; }
.meu .b { background: var(--bolha-eu); color: var(--bolha-eu-txt); }
/* Rabinho do iMessage na última bolha do bloco. */
.b.cauda::before, .b.cauda::after { content: ''; position: absolute; bottom: 0; height: 20px; }
.grupo:not(.meu) .b.cauda::before { left: -7px; width: 20px; background: var(--bolha-outro); border-bottom-right-radius: 16px 14px; }
.grupo:not(.meu) .b.cauda::after { left: -10px; width: 10px; background: var(--fundo); border-bottom-right-radius: 10px; }
.meu .b.cauda::before { right: -7px; width: 20px; background: var(--bolha-eu-fim); border-bottom-left-radius: 16px 14px; }
.meu .b.cauda::after { right: -10px; width: 10px; background: var(--fundo); border-bottom-left-radius: 10px; }
.falhou { font-size: 12px; font-weight: 600; color: var(--danger); margin: 3px 14px 0; }

/* Menção como prévia de link. */
.cartao { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; margin: 8px -1px 2px; min-width: 232px; padding: 8px 10px 8px 8px; border-radius: 14px; background: var(--cartao); color: inherit; }
.meu .cartao { background: var(--cartao-eu); }
.cartao .ic { width: 36px; height: 36px; border-radius: 10px; font-size: 17px; }
.cartao .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.cartao .tx b { font-size: 15px; font-weight: 600; line-height: 19px; }
.cartao .tx span { font-size: 13px; line-height: 17px; opacity: .62; }
.cartao > svg { width: 14px; height: 14px; opacity: .45; }
.cartao.restrito .ic { background: var(--suave); color: var(--ink3); box-shadow: none; }
.cartao.restrito .ic svg { width: 16px; height: 16px; }

/* Caixa de escrever em cápsula. */
.escreve { position: absolute; left: 10px; right: 10px; bottom: var(--eb, 96px); z-index: 6; display: flex; align-items: flex-end; gap: 8px; }
.capsula { flex: 1; min-width: 0; min-height: 44px; border-radius: 22px; display: flex; flex-direction: column; justify-content: center; padding: 0 5px 0 16px; }
.capsula .lin { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.capsula .txt { flex: 1; min-width: 0; font-size: 17px; color: var(--ink); letter-spacing: -0.02em; }
.capsula .txt.vazio { color: var(--ink3); }
.capsula .dica { font-size: 12px; color: var(--ink3); padding-right: 10px; white-space: nowrap; }
.capsula .enviar { width: 34px; height: 34px; border-radius: 17px; background: var(--ink); color: var(--bg); display: inline-flex; align-items: center; justify-content: center; }
.capsula .enviar svg { width: 18px; height: 18px; }
.cursor { display: inline-block; width: 2px; height: 21px; background: var(--gold-deep); vertical-align: -4px; margin-left: 1px; }
.anexo { display: flex; align-items: center; gap: 8px; margin: 6px 0 0 -10px; padding: 5px 6px 5px 5px; border-radius: 14px; background: var(--cartao); width: max-content; }
.anexo .ic { width: 28px; height: 28px; border-radius: 8px; font-size: 14px; }
.anexo b { font-size: 14px; font-weight: 600; }
.anexo .x { width: 26px; height: 26px; border-radius: 13px; display: inline-flex; align-items: center; justify-content: center; background: var(--suave); }
.anexo .x svg { width: 12px; height: 12px; }

/* Busca de menção: cartão de vidro acima da cápsula. */
.menu { position: absolute; left: 10px; right: 10px; z-index: 7; border-radius: 24px; padding: 8px; }
.menu h3 { font-size: 13px; font-weight: 600; color: var(--ink3); padding: 6px 10px 6px; }
.menu li { list-style: none; display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 10px; border-radius: 14px; font-size: 17px; }
.menu li.foco { background: var(--selecao); }
.menu li .ic { width: 30px; height: 30px; border-radius: 9px; font-size: 15px; }
.menu li mark { background: none; color: inherit; font-weight: 700; }

/* Barra de baixo do celular (igual à de hoje). */
.barra { position: absolute; left: 14px; right: 14px; bottom: 16px; height: 68px; border-radius: 34px; padding: 6px; display: grid; grid-template-columns: repeat(5,1fr); z-index: 8; }
.barra a { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 28px; font-size: 10px; font-weight: 500; color: var(--ink2); }
.barra a svg { width: 22px; height: 22px; }
.barra a.ativo { background: var(--on); color: var(--ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 2px 10px rgba(0,0,0,.08); }
.dark .barra a.ativo { box-shadow: inset 0 1px 0 rgba(255,255,255,.12); }
.barra .pt { position: absolute; top: 6px; right: 22%; min-width: 17px; height: 17px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center; padding: 0 4px; }

.teclado { position: absolute; left: 0; right: 0; bottom: 0; height: 291px; z-index: 8; background: var(--kb); padding: 6px 3px 0; display: flex; flex-direction: column; gap: 11px; }
.sug { height: 38px; display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: center; text-align: center; font-size: 16px; }
.sug span + span { border-left: .5px solid rgba(128,128,128,.4); }
.fila { display: flex; justify-content: center; gap: 6px; }
.tecla { height: 42px; width: 31.5px; border-radius: 5px; background: var(--tecla); box-shadow: 0 1px 0 rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center; font-size: 22px; }
.tecla.esc { background: var(--tecla2); width: 42px; font-size: 15px; } .tecla.espaco { width: 182px; font-size: 15px; } .tecla.ret { width: 88px; font-size: 15px; background: var(--tecla2); }
.dark .tecla { color: #fff; }

/* ---------- Lista de conversas ---------- */
.lista { display: flex; flex-direction: column; min-height: 0; }
.lista .acoes { display: flex; justify-content: flex-end; padding: 8px 12px 0; }
.lista h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.04em; line-height: 41px; padding: 0 18px 10px; }
.convite { margin: 4px 14px 10px; padding: 14px 14px 12px; border-radius: 22px; display: grid; grid-template-columns: 36px 1fr; column-gap: 12px; }
.convite .ic { width: 36px; height: 36px; border-radius: 10px; font-size: 16px; }
.convite .ic svg { width: 18px; height: 18px; }
.convite p { font-size: 14px; line-height: 19px; color: var(--ink2); }
.convite .bt { grid-column: 2; display: flex; gap: 2px; margin-top: 10px; }
.cap { height: 44px; padding: 0 18px; border-radius: 22px; font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; }
.cap.ink { background: var(--ink); color: var(--bg); } .cap.quieta { color: var(--ink2); }
.linha { position: relative; display: flex; gap: 12px; padding: 10px 14px 10px 16px; align-items: center; }
.linha + .linha::before { content: ''; position: absolute; top: 0; left: 80px; right: 0; height: .5px; background: var(--line); }
.linha .meio { flex: 1; min-width: 0; }
.linha .l1 { display: flex; align-items: center; gap: 6px; }
.linha .nm { flex: 1; min-width: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
.linha .qd { font-size: 15px; color: var(--ink3); }
.linha .l1 > svg { width: 13px; height: 13px; color: var(--ink3); opacity: .7; }
.linha.nova .qd { color: var(--gold-text); font-weight: 600; }
.linha .l2 { display: flex; gap: 10px; align-items: flex-start; margin-top: 2px; }
.linha .pv { flex: 1; min-width: 0; font-size: 15px; line-height: 20px; color: var(--ink2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.linha .l2 .selo { margin-top: 4px; }

/* Folha "Nova conversa". */
.veu { position: absolute; inset: 0; background: rgba(0,0,0,.28); z-index: 20; }
.folha { position: absolute; left: 8px; right: 8px; bottom: 8px; top: 58px; z-index: 21; border-radius: 34px; background: var(--fundo); box-shadow: 0 -10px 40px -10px rgba(0,0,0,.3); padding-top: 10px; overflow: hidden; }
.folha .fc { display: flex; align-items: center; justify-content: center; height: 52px; position: relative; }
.folha .fc .circ { position: absolute; left: 10px; }
.folha .fc h2 { font-size: 17px; font-weight: 600; }
.busca { margin: 6px 16px 14px; height: 44px; border-radius: 22px; background: var(--suave); display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 17px; color: var(--ink3); }
.busca svg { width: 18px; height: 18px; }
.grupo-lista { margin: 0 16px; border-radius: 20px; background: var(--bolha-outro); overflow: hidden; }
.dark .grupo-lista { background: #1c1c20; }
.pessoa { position: relative; display: flex; align-items: center; gap: 12px; height: 58px; padding: 0 16px; font-size: 17px; }
.pessoa + .pessoa::before { content: ''; position: absolute; top: 0; left: 64px; right: 0; height: .5px; background: var(--line); }
.pessoa .nm { flex: 1; }

/* ---------- Tablet e computador ---------- */
.mesa { display: flex; height: 100vh; }
.side { width: 236px; margin: 10px 0 10px 10px; border-radius: 24px; padding: 12px 10px; display: flex; flex-direction: column; gap: 14px; flex: none; }
.side .marca { display: flex; align-items: center; gap: 8px; padding: 4px 4px 0 8px; font-size: 15px; font-weight: 600; }
.mk { width: 32px; height: 32px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; background: linear-gradient(160deg,#1c1b19,#050506); color: var(--gold); font: 17px Anton, Impact, sans-serif; flex: none; }
.side .procurar { height: 34px; border-radius: 8px; background: rgba(255,255,255,.6); box-shadow: inset 0 0 0 .5px rgba(60,60,67,.2); display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 14px; font-weight: 500; color: var(--ink2); }
.dark .side .procurar { background: rgba(255,255,255,.06); }
.side .procurar svg { width: 16px; height: 16px; }
.side .procurar kbd { margin-left: auto; font: 500 11px Geist, system-ui; color: var(--ink3); }
.side nav { display: flex; flex-direction: column; gap: 1px; }
.side nav a { position: relative; height: 34px; border-radius: 8px; padding: 0 10px; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; color: var(--ink2); }
.side nav a svg { width: 16px; height: 16px; }
.side nav a.ativo { background: var(--on); color: var(--ink); box-shadow: inset 0 1px 0 #fff, 0 2px 10px rgba(0,0,0,.08); }
.dark .side nav a.ativo { box-shadow: inset 0 1px 0 rgba(255,255,255,.1); }
.side nav a .ct { margin-left: auto; min-width: 18px; height: 18px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.side .eu { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 8px; border-top: .5px solid var(--line); }
.side .eu small { display: block; font-size: 12px; color: var(--ink2); } .side .eu b { font-size: 14px; font-weight: 600; }
/* Trilho (sidebar recolhida, 56 px, como já existe no app). */
.side.trilho { width: 56px; padding: 12px 10px; align-items: center; }
.side.trilho .marca { padding: 4px 0 0; }
.side.trilho :is(.rot, kbd) { display: none; }
.side.trilho .procurar { width: 36px; padding: 0; justify-content: center; }
.side.trilho nav a { width: 36px; padding: 0; justify-content: center; }
.side.trilho nav a .ct { position: absolute; top: 1px; right: -3px; min-width: 15px; height: 15px; font-size: 9px; }
.side.trilho .eu { padding: 8px 0; justify-content: center; }

.palco { flex: 1; min-width: 0; padding: 10px; display: flex; }
.painel { flex: 1; min-width: 0; display: grid; grid-template-columns: var(--lw, 340px) minmax(0,1fr); border-radius: 26px; overflow: hidden; box-shadow: var(--gld), 0 0 0 .5px var(--line); }
.painel .lado { background: var(--gl2); -webkit-backdrop-filter: blur(30px) saturate(2.1); backdrop-filter: blur(30px) saturate(2.1); border-right: .5px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.dark .painel .lado { background: rgba(24,24,27,.85); }
.painel .lado .topo-l { display: flex; align-items: center; justify-content: space-between; padding: 16px 12px 8px 20px; }
.painel .lado h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.035em; }
.painel .lado .circ { width: 38px; height: 38px; }
.painel .lado .circ svg { width: 18px; height: 18px; }
.painel .lado .convite { margin: 4px 12px 8px; grid-template-columns: 30px 1fr; column-gap: 10px; padding: 12px; border-radius: 18px; }
.painel .lado .convite .ic { width: 30px; height: 30px; border-radius: 9px; }
.painel .lado .convite p { font-size: 12.5px; line-height: 17px; }
.painel .lado .convite .cap { height: 34px; padding: 0 14px; font-size: 13px; border-radius: 17px; }
.painel .lado .linhas { padding: 0 8px; }
.painel .lado .linha { border-radius: 14px; padding: 9px 10px; }
.painel .lado .linha::before { display: none; }
.painel .lado .linha.ativa { background: var(--selecao); }
.painel .lado .linha .av, .painel .lado .linha .canal { width: 44px !important; height: 44px !important; }
.painel .lado .linha .nm { font-size: 15px; } .painel .lado .linha .qd { font-size: 13px; }
.painel .lado .linha .pv { font-size: 13.5px; line-height: 18px; }
.painel .conv { position: relative; min-height: 0; }
.painel .conversa { --pt: 84px; --pb: 96px; --bt: 92px; --bb: 120px; --eb: 18px; }
.painel .cab { top: 14px; }
.painel .cab .quem { flex-direction: row; gap: 8px; height: 44px; padding: 0 16px 0 7px; border-radius: 22px; }
.painel .cab .nome { height: auto; padding: 0; font-size: 15px; background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
.painel .escreve { left: 0; right: 0; margin: 0 auto; width: min(100% - 40px, 760px); }
.mesa-larga .b { font-size: 15px; line-height: 21px; padding: 8px 13px; }
.mesa-larga .cartao .tx b { font-size: 14px; } .mesa-larga .cartao .tx span { font-size: 12px; }
.mesa-larga .capsula .txt { font-size: 15px; }
.mesa-larga .grupo .col { max-width: 66%; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const P = new URLSearchParams(location.search);
const V = P.get('v') || 'A1';
const TELA = P.get('tela') || 'conversa';
const W = innerWidth;
document.body.classList.add(V);
if (P.get('tema') === 'escuro') document.body.classList.add('dark');
if (P.get('novo') !== '0') document.body.classList.add('anota');

const I = {
  voltar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  seta: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  hash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M5 9h15M4 15h15M10 3.5 8 20.5M16 3.5 14 20.5"/></svg>',
  subir: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  escrever: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/><path d="M17.6 3.6a2 2 0 0 1 2.8 2.8L12 14.8 8.5 15.5l.7-3.5Z"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  busca: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  cadeado: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  relogio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  sino: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>',
  dash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="7" height="9" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="5" rx="1.5"/><rect x="13.5" y="11.5" width="7" height="9" rx="1.5"/><rect x="3.5" y="15.5" width="7" height="5" rx="1.5"/></svg>',
  hoje: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  pipe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="4" width="4.5" height="16" rx="1.2"/><rect x="9.8" y="4" width="4.5" height="11" rx="1.2"/><rect x="16" y="4" width="4.5" height="7" rx="1.2"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5.5h16v11H10l-4.5 3.5v-3.5H4z"/></svg>',
  pontos: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  leads: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2 .7 3 2.8 3 6"/></svg>',
  rel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V4M4 20h16M8 16v-4M12 16V8M16 16v-6"/></svg>',
  equipe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.9 3.1-6.5 7-6.5s7 2.6 7 6.5"/></svg>',
  livro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4.5h10a4 4 0 0 1 4 4v11H9a4 4 0 0 1-4-4z"/><path d="M5 15.5a4 4 0 0 1 4-4h10"/></svg>',
};

const CONVERSAS = [
  { geral: true, nome: 'Geral', previa: 'Ana: Está na pasta da equipe. Se não achar, me chama.', quando: '10:08', nao: 3 },
  { nome: 'Ana', previa: 'Consegue ligar para a Marina Duarte hoje? Ela pediu retorno à tarde.', quando: '09:41', nao: 1 },
  { nome: 'Sonia', previa: 'Você: Perfeito, obrigado!', quando: 'Ontem' },
  { nome: 'Ronaldo', previa: 'Valeu, time.', quando: 'Segunda' },
  { nome: 'Murilo', previa: 'Você: Te passo o contato depois.', quando: '20/11' },
];
const PESSOAS = [['Ale', 'SDR', 'SDR'], ['Ana', 'HEAD', 'Head'], ['Diretor', 'DIRETOR', 'Diretoria'], ['Murilo', 'SDR', 'SDR'], ['Ronaldo', 'HEAD', 'Head'], ['Sonia', 'CLOSER', 'Closer']];
const G = {
  ronaldo: { autor: 'Ronaldo', hora: '18:32', linhas: [{ t: 'Esse lead passou para outra carteira.', restrito: true }] },
  ana1: { autor: 'Ana', hora: '09:13', linhas: [{ t: 'Bom dia! Alinhamento às 14h.' }, { t: 'Atualizem as remarcadas antes disso.' }] },
  sonia: { autor: 'Sonia', hora: '09:20', linhas: [{ t: 'A Carolina confirmou para as 17h.', lead: 'Carolina Mendes' }] },
  eu: { autor: 'Você', eu: true, hora: '09:24', linhas: [{ t: 'Boa! Deixei o resumo na ficha.' }, { t: 'A Marina pediu ligação às 18h.', lead: 'Marina Duarte' }] },
  murilo: { autor: 'Murilo', hora: '10:05', linhas: [{ t: 'Alguém tem o link do material do RDV?' }] },
  ana2: { autor: 'Ana', hora: '10:08', linhas: [{ t: 'Está na pasta da equipe. Se não achar, me chama.' }] },
};
const CEL = [{ dia: 'Hoje', grupos: [G.ana1, G.sonia, G.eu, G.ana2] }];
const MESA = [{ dia: 'Segunda, 23 de nov.', grupos: [G.ronaldo] }, { dia: 'Hoje', grupos: [G.ana1, G.sonia, G.eu, G.murilo, G.ana2] }];

const av = (n, px) => `<span class="av ${n === 'Você' || n === 'Igor' ? 'eu' : ''}" style="width:${px}px;height:${px}px;font-size:${Math.round(px * .42)}px">${n === 'Você' ? 'I' : n[0]}</span>`;
const canal = (px, extra = '') => `<span class="canal ${extra}" style="width:${px}px;height:${px}px;border-radius:${Math.round(px * .3)}px;font-size:${Math.round(px * .46)}px">#</span>`;
const cartao = (l) => l.restrito
  ? `<a class="cartao restrito"><span class="canal ic">${I.cadeado}</span><span class="tx"><b>lead restrito</b></span></a>`
  : `<a class="cartao"><span class="canal ic">#</span><span class="tx"><b class="trunc">${l.lead}</b><span>Abrir ficha</span></span>${I.seta}</a>`;

function mensagens(dias, inicio = '') {
  return inicio + dias.map((d) => `<p class="dia"><b>${d.dia}</b></p>` + d.grupos.map((g) => `
    <div class="grupo ${g.eu ? 'meu' : ''}">
      ${g.eu ? '' : av(g.autor, 28)}
      <div class="col">
        ${g.eu ? '' : `<span class="autor">${g.autor}</span>`}
        ${g.linhas.map((l, i) => `<div class="b ${i === g.linhas.length - 1 ? 'cauda' : ''}">${l.t}${l.lead || l.restrito ? cartao(l) : ''}</div>`).join('')}
        <span class="hora">${g.hora}</span>
      </div>
    </div>`).join('')).join('');
}
const antigas = `<button class="antigas novo">${I.relogio}Ver mensagens anteriores</button>`;

function barra() {
  const it = [['Dashboard', I.dash], ['Hoje', I.hoje], ['Pipeline', I.pipe], ['Chat', I.chat, 1], ['Mais', I.pontos]];
  return `<nav class="barra glass">${it.map(([n, ic, pt]) => `<a class="${n === 'Chat' ? 'ativo' : ''}">${ic}${n}${pt ? `<span class="pt">${pt}</span>` : ''}</a>`).join('')}</nav>`;
}
function teclado() {
  const f = (s) => `<div class="fila">${[...s].map((c) => `<span class="tecla">${c}</span>`).join('')}</div>`;
  return `<div class="teclado"><div class="sug"><span>“as”</span><span>às</span><span>ao</span></div>${f('qwertyuiop')}${f('asdfghjkl')}
    <div class="fila"><span class="tecla esc">⇧</span>${[...'zxcvbnm'].map((c) => `<span class="tecla">${c}</span>`).join('')}<span class="tecla esc">⌫</span></div>
    <div class="fila"><span class="tecla esc">123</span><span class="tecla esc">☺</span><span class="tecla espaco">espaço</span><span class="tecla ret">retorno</span></div></div>`;
}
const cabecalho = (larga) => `<header class="cab">
  ${larga ? '' : `<button class="circ vidro voltar" aria-label="Conversas">${I.voltar}</button>`}
  <div class="quem ${larga ? 'vidro' : ''}">${canal(larga ? 30 : 44)}<span class="nome ${larga ? '' : 'vidro'}">Geral${larga ? '' : I.seta}</span></div></header>`;

function caixa(estado, larga) {
  if (estado === 'busca') {
    return `<div class="escreve"><button class="circ vidro" aria-label="Fechar busca">${I.x}</button>
      <div class="capsula vidro"><div class="lin">${I.busca.replace('<svg', '<svg style="width:18px;height:18px;color:var(--ink3)"')}<span class="txt">caro<span class="cursor"></span></span></div></div></div>`;
  }
  const digitando = estado === 'digitando';
  return `<div class="escreve"><button class="circ vidro" aria-label="Mencionar lead">${I.hash}</button>
    <div class="capsula vidro" ${digitando ? 'style="border-radius:24px"' : ''}>
      ${digitando ? `<div class="anexo"><span class="canal ic">#</span><b>Carolina Mendes</b><span class="x" aria-label="Remover menção">${I.x}</span></div>` : ''}
      <div class="lin"><span class="txt ${digitando ? '' : 'vazio'}">${digitando ? 'Ela pediu para remarcar para as<span class="cursor"></span>' : larga ? 'Mensagem para Geral' : 'Mensagem'}</span>
        ${digitando ? `<button class="enviar" aria-label="Enviar">${I.subir}</button>` : larga && W >= 1200 ? '<span class="dica">Enter envia. Shift+Enter pula linha.</span>' : ''}</div></div></div>`;
}

function telaConversa(estado) {
  const kb = estado !== 'vazio';
  const vars = kb ? `--pb:${estado === 'digitando' ? 410 : 520}px;--eb:299px;--bb:420px` : '--pb:172px;--eb:96px;--bb:200px';
  const menu = estado === 'busca' ? `<div class="menu vidro" style="bottom:${291 + 8 + 44 + 10}px"><h3>Mencionar lead</h3><ul>
    <li class="foco">${canal(30, 'ic')}<span><mark>Caro</mark>lina Mendes</span></li><li>${canal(30, 'ic')}<span><mark>Caro</mark>lina Souza Lima</span></li><li>${canal(30, 'ic')}<span><mark>Caro</mark>line Prado</span></li></ul></div>` : '';
  return `<div class="conversa" style="${vars}"><div class="rola"><div class="coluna">${mensagens(CEL, kb ? '' : antigas)}</div></div>
    <div class="borda topo"></div><div class="borda base"></div>${cabecalho(false)}${menu}${caixa(estado, false)}${kb ? teclado() : barra()}</div>`;
}

function linhaConv(c, ativa) {
  return `<div class="linha ${c.nao ? 'nova' : ''} ${ativa ? 'ativa' : ''}">${c.geral ? canal(52) : av(c.nome, 52)}
    <div class="meio"><div class="l1"><span class="nm trunc">${c.nome}</span><span class="qd">${c.quando}</span>${I.seta}</div>
      <div class="l2 ${c.geral && !ativa ? 'novo abaixo' : ''}"><span class="pv">${c.previa}</span>${c.nao ? `<span class="selo" aria-label="${c.nao} não lidas">${c.nao}</span>` : ''}</div></div></div>`;
}
const convite = `<div class="convite vidro"><span class="canal ic">${I.sino}</span><p>Receba no celular ou no computador, mesmo com o CRM fechado, os avisos do sino, as mensagens do chat e os lembretes das suas reuniões.</p>
  <div class="bt"><button class="cap ink">Ativar avisos</button><button class="cap quieta">Agora não</button></div></div>`;

function telaLista() {
  return `<div class="lista" style="height:100vh"><div class="acoes"><button class="circ vidro" aria-label="Nova conversa">${I.escrever}</button></div>
    <h1>Chat</h1>${convite}<div>${CONVERSAS.map((c) => linhaConv(c)).join('')}</div></div>${barra()}`;
}
function telaNova() {
  return telaLista() + `<div class="veu"></div><div class="folha"><div class="fc"><button class="circ vidro" aria-label="Fechar">${I.x}</button><h2>Nova conversa</h2></div>
    <div class="busca novo">${I.busca}Buscar pessoa</div>
    <div class="grupo-lista">${PESSOAS.map(([n, r, rl]) => `<div class="pessoa">${av(n, 36)}<span class="nm">${n}</span><span class="tag role-${r}">${rl}</span></div>`).join('')}</div></div>`;
}

function sidebar(trilho) {
  const it = [['Avisos', I.sino], ['Dashboard', I.dash], ['Hoje', I.hoje], ['Pipeline', I.pipe], ['Leads', I.leads], ['Relatórios', I.rel], ['Chat', I.chat, 1], ['Equipe', I.equipe], ['Playbook', I.livro]];
  return `<aside class="side glass ${trilho ? 'trilho' : ''}"><div class="marca"><span class="mk">N</span><span class="rot">NPAC Corporation</span></div>
    <div class="procurar">${I.busca}<span class="rot">Buscar</span><kbd>Ctrl K</kbd></div>
    <nav>${it.map(([n, ic, ct]) => `<a class="${n === 'Chat' ? 'ativo' : ''}">${ic}<span class="rot">${n}</span>${ct ? `<span class="ct">${ct}</span>` : ''}</a>`).join('')}</nav>
    <div class="eu">${av('Igor', 32)}<div class="rot"><b>Igor</b><small>SDR</small></div></div></aside>`;
}
function telaMesa() {
  const trilho = W < 900;
  const larga = W >= 1200;
  if (larga) document.body.classList.add('mesa-larga');
  const lw = W >= 1200 ? 340 : W >= 1000 ? 300 : 292;
  return `<div class="mesa">${sidebar(trilho)}<main class="palco"><div class="painel" style="--lw:${lw}px">
    <div class="lado"><div class="topo-l"><h1>Chat</h1><button class="circ vidro" aria-label="Nova conversa">${I.escrever}</button></div>
      ${convite}<div class="linhas">${CONVERSAS.map((c, i) => linhaConv(c, i === 0)).join('')}</div></div>
    <section class="conv"><div class="conversa"><div class="rola"><div class="coluna">${mensagens(MESA, antigas)}</div></div>
      <div class="borda topo"></div><div class="borda base"></div>${cabecalho(true)}${caixa('vazio', true)}</div></section></div></main></div>`;
}

document.getElementById('app').innerHTML = {
  lista: telaLista, nova: telaNova, mesa: telaMesa,
  conversa: () => telaConversa('vazio'), teclado: () => telaConversa('digitando'), mencao: () => telaConversa('busca'),
}[TELA]();
</script>
</body>
</html>
