packages:
  - 'apps/*'
  - 'packages/*'

# pnpm bloqueia scripts de build de dependências por padrão; liste aqui as permitidas.
allowBuilds:
  esbuild: true
  '@swc/core': true

# Unifica versões corrigidas inclusive nas dependências transitivas do Nest/Auth.
overrides:
  fastify: 5.12.7
  vitest: 5.0.5

# Alertas aceitos no `pnpm audit` (CI). Revisar quando sair correção.
auditConfig:
  ignoreGhsas:
    # picomatch <= 4.0.7, ReDoS (17/11/2026): só nas ferramentas de teste (vitest/vite), sem versão
    # corrigida publicada. Remover quando houver e atualizar.
    - GHSA-fc5q-39xc-vjpf
