packages:
  - 'apps/*'
  - 'packages/*'

# pnpm bloqueia scripts de build de dependências por padrão; liste aqui as permitidas.
allowBuilds:
  esbuild: true
  '@swc/core': true

# Unifica versões corrigidas inclusive nas dependências transitivas do Nest/Auth.
overrides:
  fastify: 5.12.7
  vitest: 5.0.5
